# Ubicación: .github/workflows/qa.yml (raíz del repositorio)
# FLUJO RÁPIDO: corre en cada push y pull request. NO consulta tiendas reales (usa tiendas simuladas).
name: QA Picksy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # solo para guardar el registro en la rama qa-registros (nunca en main)

    env:
      # Base de datos DESECHABLE que solo existe durante la prueba (no son credenciales reales).
      DB_USER: postgres
      DB_PASSWORD: ci_password_no_secreta
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: smartbudget
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}   # solo para saber si el correo está configurado

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_no_secreta
          POSTGRES_DB: smartbudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Picksy_Backend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Picksy_Backend/requirements.txt
            Picksy_Backend/requirements-qa.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-qa.txt

      - name: Crear .env de prueba (solo en el servidor de CI)
        run: |
          printf 'DB_USER=postgres\nDB_PASSWORD=ci_password_no_secreta\nDB_HOST=localhost\nDB_PORT=5432\nDB_NAME=smartbudget\n' > .env

      - name: Preparar base de datos
        run: python preparar_base.py

      - name: Bot de QA (tiendas simuladas)
        id: bot
        run: pytest qa -v -p no:cacheprovider --html=reporte_bot.html --self-contained-html

      - name: Pruebas existentes de test_api.py (sin tiendas reales)
        id: api
        if: ${{ !cancelled() }}
        run: pytest test_api.py -v -m "not slow" -p no:cacheprovider --html=reporte_api.html --self-contained-html

      - name: Resumen en la página de la ejecución
        if: ${{ always() }}
        run: |
          if [ -f qa_salida/resumen.md ]; then cat qa_salida/resumen.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Calcular resultado
        id: res
        if: ${{ always() }}
        run: |
          if [ "${{ steps.bot.outcome }}" = "success" ] && [ "${{ steps.api.outcome }}" = "success" ]; then
            echo "estado=PASARON" >> "$GITHUB_OUTPUT"; echo "icono=✅" >> "$GITHUB_OUTPUT"
            echo "otros=false" >> "$GITHUB_OUTPUT"
          else
            echo "estado=TIENEN FALLOS" >> "$GITHUB_OUTPUT"; echo "icono=❌" >> "$GITHUB_OUTPUT"
            echo "otros=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "Se ejecutaron las pruebas automatizadas de Picksy (tiendas simuladas)."
            echo "Resultado general: $( [ "${{ steps.bot.outcome }}" = "success" ] && [ "${{ steps.api.outcome }}" = "success" ] && echo PASARON || echo TIENEN FALLOS )"
            echo "Bot de QA: ${{ steps.bot.outcome }} · test_api.py: ${{ steps.api.outcome }}"
            echo "Lanzado por: ${{ github.actor }} · Evento: ${{ github.event_name }} · Rama: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f qa_salida/resumen.md ]; then cat qa_salida/resumen.md; fi
          } > correo.txt

      # Un fallo al guardar el registro NUNCA debe poner en rojo al proyecto.
      - name: Guardar registro permanente (rama qa-registros)
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          OTROS_FALLARON: ${{ steps.res.outputs.otros }}
        run: bash qa/guardar_registro.sh

      - name: Guardar reportes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reportes-qa
          path: |
            Picksy_Backend/reporte_*.html
            Picksy_Backend/qa_salida/
          if-no-files-found: ignore
          retention-days: 90

      - name: Enviar correo con el resultado
        if: ${{ always() && env.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "Picksy QA <${{ secrets.MAIL_USERNAME }}>"
          subject: "${{ steps.res.outputs.icono }} Picksy QA: las pruebas ${{ steps.res.outputs.estado }} (${{ github.ref_name }})"
          body: file://Picksy_Backend/correo.txt
          attachments: Picksy_Backend/reporte_*.html
