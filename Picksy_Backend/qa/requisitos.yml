# =====================================================================
# requisitos.yml  -  FUENTE DE VERDAD de QA (sale del ERS v1.0)
# Lo mantiene el ingeniero de QA. Si el ERS agrega RF-18, se agrega aquí
# y el bot avisa "REQUISITO SIN PRUEBA" hasta que alguien escriba su caso.
#
# Campos:
#   id            identificador del ERS
#   titulo        resumen corto
#   prioridad     Alta / Media (RF) o "-" (RNF, el ERS no la define)
#   implementado  false = esa versión no tiene ese código (se verifica en el contrato)
#   bloqueado_por ambigüedades del ERS (A-xx) que impiden definir el oráculo
#   metodo_manual true = no se puede automatizar del todo (usabilidad, legal...)
#   propuesto     true = función que existe en el código pero NO está en el ERS: QA la prueba, pero no cuenta en 'X de 25'
#   pendiente     parte del requisito que el bot NO verifica: el estado sale como 'Parcial', no 'Verificado'
# =====================================================================
version_ers: "1.0"

tiendas_ers:            # RF-04 y sección 2.1 del ERS: las 10 tiendas del alcance
  - Mercado Libre
  - Alkosto
  - Homecenter
  - Éxito
  - Falabella
  - Ktronix
  - Farmatodo
  - Alkomprar
  - Olímpica
  - Buscalibre

requisitos:
  - {id: RF-01, titulo: Registro con correo y contraseña, prioridad: Alta}
  - {id: RF-02, titulo: Inicio y cierre de sesión seguros, prioridad: Alta}
  - {id: RF-03, titulo: Sesión activa que expira de forma controlada, prioridad: Media}
  - {id: RF-04, titulo: "Precio, envío y disponibilidad de las 10 tiendas", prioridad: Alta}
  - {id: RF-05, titulo: Caché con vigencia y fecha de actualización, prioridad: Alta}
  - {id: RF-06, titulo: Tienda caída - avisa y continúa con las demás, prioridad: Alta}
  - {id: RF-07, titulo: Entrada de producto y presupuesto máximo, prioridad: Alta}
  - {id: RF-08, titulo: Total = precio + envío, prioridad: Alta}
  - {id: RF-09, titulo: Descarta opciones sobre el presupuesto, prioridad: Alta}
  - {id: RF-10, titulo: Ordena viables por total ascendente, prioridad: Alta}
  - {id: RF-11, titulo: Mejor opción y ahorro, prioridad: Alta, bloqueado_por: [A-02]}
  - {id: RF-12, titulo: Enlace a la tienda original, prioridad: Alta, pendiente: "que el enlace abra la página correcta (muestreo manual CP-12.2)"}
  - {id: RF-13, titulo: Lista de productos con prioridad (carritos), prioridad: Alta, bloqueado_por: [A-03], nota: "Implementado en la v3 (rutas /carritos). La escala de prioridad 1-5 (5 = indispensable) es decisión de Backend: el ERS no la define (A-03)."}
  - {id: RF-14, titulo: Mochila 0/1, prioridad: Alta, nota: "Implementado en la v3 (POST /carritos/{id}/optimizar). Se verifica contra el oráculo qa/referencia_mochila.py."}
  - {id: RF-15, titulo: Guarda las búsquedas del usuario, prioridad: Media}
  - {id: RF-16, titulo: Variación de precios en el tiempo, prioridad: Media, nota: "Implementado en la v3 (GET /productos/precios)."}
  - {id: RF-17, titulo: Comparar carritos, prioridad: Media, nota: "Implementado en la v3 (GET /carritos/comparar)."}
  - {id: RNF-01, titulo: Búsqueda en menos de 5 s con caché, prioridad: "-"}
  - {id: RNF-02, titulo: "Hash bcrypt, HTTPS y consultas parametrizadas", prioridad: "-", pendiente: "HTTPS (solo se verifica en un despliegue)"}
  - {id: RNF-03, titulo: Usabilidad - flujo en pocos pasos, prioridad: "-", metodo_manual: true}
  - {id: RNF-04, titulo: Compatibilidad con navegadores y responsivo, prioridad: "-", metodo_manual: true}
  - {id: RNF-05, titulo: La caída de una tienda no deja el sistema fuera de servicio, prioridad: "-"}
  - {id: RNF-06, titulo: Subsistemas independientes, prioridad: "-", metodo_manual: true}
  - {id: RNF-07, titulo: Ley 1581 y términos de uso de las tiendas, prioridad: "-", metodo_manual: true}
  - {id: RNF-08, titulo: Fecha y hora de actualización en cada precio, prioridad: "-", pendiente: "que la pantalla muestre la fecha (Playwright, fase 3)"}
  - id: RF-18
    titulo: "Verificación en dos pasos (2FA) con TOTP - PROPUESTO por QA"
    prioridad: "-"
    propuesto: true
    nota: "Llegó en la v2 sin ID de requisito (el ERS sección 11 exige uno). En la v3 pasó de OPCIONAL a OBLIGATORIO (registro y login). Requerimientos debe aprobarlo, rechazarlo o pedir que se retire."
  - id: RF-19
    titulo: "Roles y panel de administrador - PROPUESTO por QA"
    prioridad: "-"
    propuesto: true
    nota: "Llegó en la v3 sin ID de requisito. Rol 'usuario' y 'admin'; el admin lista, elimina usuarios y cambia roles."
  - id: RF-20
    titulo: "Recuperar contraseña y códigos de recuperación del 2FA - PROPUESTO por QA"
    prioridad: "-"
    propuesto: true
    nota: "Llegó en la v3 sin ID de requisito. Enlace por correo + código del Authenticator; 8 códigos de un solo uso si se pierde el teléfono."
  - id: RNF-09
    titulo: "Límite de intentos (429) contra fuerza bruta y abuso - PROPUESTO por QA"
    prioridad: "-"
    propuesto: true
    nota: "Llegó en la v3 sin ID de requisito. Login, código de 6 dígitos, registro y recuperación."
  - id: RNF-10
    titulo: "API versionada (/api/v1), errores en formato unificado y CORS configurable - PROPUESTO por QA"
    prioridad: "-"
    propuesto: true
    nota: "Llegó en la v3 sin ID de requisito (lo pidió el profesor)."
