# /etc/nginx/sites-available/picksy   (luego:  sudo ln -s /etc/nginx/sites-available/picksy /etc/nginx/sites-enabled/ )
# Cambia  tudominio.com  por tu dominio. Después ejecuta:  sudo certbot --nginx -d tudominio.com
server {
    listen 80;
    server_name tudominio.com;

    # Frontend (los archivos HTML/CSS/JS)
    root /home/ubuntu/picksy/frontend;
    index login.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # API: todo lo que empiece por /api/ se pasa al backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;     # una búsqueda sin caché puede tardar ~10 s
    }
}
